name: "Lint LaTeX files"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: "read"

jobs:
  lint:
    name: "Lint LaTeX files"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Check out repository"
        uses: "actions/checkout@v7"

      - name: "Install `chktex` package"
        run: |
          sudo apt-get update
          sudo apt-get install -y chktex

      - name: "Lint LaTeX source"
        shell: bash
        run: |
          chktex *.tex
